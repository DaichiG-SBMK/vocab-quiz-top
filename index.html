<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>語彙テスト</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f4f6;
      color: #111827;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      background: #ffffff;
      padding: 32px 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      max-width: 480px;
      width: 90%;
      text-align: center;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 24px;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .btn-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 20px;
      border-radius: 999px;
      border: none;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.1s ease;
    }

    .btn-primary {
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 6px 14px rgba(37, 99, 235, 0.3);
    }

    .btn-primary:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(37, 99, 235, 0.35);
    }

    .btn-secondary {
      background: #10b981;
      color: #ffffff;
      box-shadow: 0 6px 14px rgba(16, 185, 129, 0.3);
    }

    .btn-secondary:hover {
      background: #059669;
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(16, 185, 129, 0.35);
    }

    @media (min-width: 640px) {
      .button-group {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>語彙テスト</h1>

    <div class="button-group">
      <!-- 夏 英⇒日 -->
      <a
        class="btn-link btn-primary"
        href="https://daichig-sbmk.github.io/Sokutan-Summer-Eng-to-Jap/"
      >
        速単夏休み範囲【英⇒日】
      </a>

      <!-- 夏 日⇒英 -->
      <a
        class="btn-link btn-secondary"
        href="https://daichig-sbmk.github.io/Sokutan-Summer-Jap-to-Eng/"
      >
        速単夏休み範囲【日⇒英】
      </a>

      <!-- 冬 英⇒日 -->
      <a
        class="btn-link btn-primary"
        href="https://daichig-sbmk.github.io/Sokutan-Winter-Eng-to-Jap/"
      >
        速単冬休み範囲【英⇒日】
      </a>

      <!-- 冬 日⇒英 -->
      <a
        class="btn-link btn-secondary"
        href="https://daichig-sbmk.github.io/Sokutan-Winter-Jap-to-Eng/"
      >
        速単冬休み範囲【日⇒英】
      </a>
    </div>
  </div>
</body>
</html>
